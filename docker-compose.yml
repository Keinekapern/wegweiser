name: wegweiser
services:
  wegweiser:
    build: .
    container_name: wegweiser
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/wegweiser.sqlite}
      # daily database backups (app/services/backup.py) into the second volume below
      BACKUP_DIR: /backups
      # local time for dates on the printout ("Erstellt am", timetable as of)
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${APP_PORT:-8420}:8000"
    # lets the app reach services on the same machine, e.g. selfhost/ (MOTIS, openrouteservice):
    # TRANSITOUS_BASE_URL=http://host.docker.internal:8421
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # backups: best on a second drive or a cloud-synced folder, e.g. BACKUP_PATH=/mnt/usb/wegweiser
      - ${BACKUP_PATH:-./backups}:/backups
    deploy:
      resources:
        limits:
          # ~100 MB normally; headless Chromium for PDF exports needs several hundred MB more
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Optional: access from outside the office network through a Cloudflare Tunnel.
  # Only together with Cloudflare Access (login) - Wegweiser itself has no login.
  # Start with: docker compose --profile tunnel up -d   (setup: README, "Zugriff von außen")
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: wegweiser-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - wegweiser
    deploy:
      resources:
        limits:
          memory: 128m
