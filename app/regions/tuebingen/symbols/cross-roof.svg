        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arms 5.2 long on each side of the 3.6 wide centre: 14 x 14 overall -->
  <path d="M10.2 8h3.6v5.2h5.2v3.6h-5.2v5.2h-3.6v-5.2H5v-3.6h5.2z" fill="#000"/>
