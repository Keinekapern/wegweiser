  <form method="post" action="/admin/password" class="form">
    <label>{{ t("Bisheriges Passwort") }}<input name="current" type="password" required autocomplete="current-password"></label>
    <label>{{ t("Neues Passwort") }}<input name="password" type="password" required minlength="{{ min_password }}" autocomplete="new-password"></label>
    <label>{{ t("Passwort wiederholen") }}<input name="repeat" type="password" required minlength="{{ min_password }}" autocomplete="new-password"></label>
    <div class="buttons"><button type="submit">{{ t("Passwort ändern") }}</button></div>
  </form>
  <p class="hint">{{ t("Nach dem Ändern werden alle anderen Anmeldungen dieses Kontos beendet.") }}</p>
