# Weekly pull requests for new versions; the test workflow runs on each of them.
# Security fixes come immediately (Dependabot security updates in the repo settings).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"            # base image of the Dockerfile
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    ignore:
      # a new Python version (3.12 -> 3.13 ...) is done by hand, with a check of the
      # Chromium libraries in the Dockerfile; Debian/Python patch updates come via rebuild.sh
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"    # cloudflared, MOTIS, openrouteservice
    directories: ["/", "/selfhost"]
    schedule: { interval: "weekly", day: "monday" }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
