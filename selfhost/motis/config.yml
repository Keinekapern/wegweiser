# MOTIS 2 configuration for Wegweiser (generated with `motis config`, then trimmed:
# no map tiles, no geocoding, no live map - Wegweiser only uses /api/v6/plan).
osm: /downloads/region.osm.pbf
timetable:
  first_day: TODAY
  num_days: 120
  tb: false
  railviz: false
  with_shapes: true
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  # Bus routes: the NVBW shapes often jump in straight lines between stops (e.g. across
  # station tracks), so MOTIS computes bus shapes from OpenStreetMap (bus profile, knows
  # bus lanes and bus gates). Other modes keep the shapes from the timetable.
  route_shapes:         # clasz names as in nigiri to_clasz (LONGDISTANCE, AERIALLIFT without "_")
    mode: all
    clasz:
      BUS: true
      AIR: false
      HIGHSPEED: false
      LONGDISTANCE: false
      COACH: false
      NIGHT: false
      RIDE_SHARING: false
      REGIONAL: false
      SUBURBAN: false
      SUBWAY: false
      TRAM: false
      SHIP: false
      ODM: false
      FUNICULAR: false
      AERIALLIFT: false
      OTHER: false
    n_threads: 6        # leave some cores to the other services on the server
  datasets:
    gtfs:
      path: /downloads/timetable.gtfs.zip
      script: /data/line-colors.lua     # generated by update.sh (line_colors.py)
      extend_calendar: false
      default_bikes_allowed: false
      default_cars_allowed: false
      default_reservation_not_required: true
elevators: false
street_routing: true
osr_footpath: false
geocoding: false
reverse_geocoding: false
